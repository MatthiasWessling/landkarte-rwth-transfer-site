<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Detail — RWTH Transfer-Landkarte</title>
  <link rel="stylesheet" href="assets/rwth-cms.css" />
  <style>
    :root {
      --accent: var(--clr-blue);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--font-rwth);
      color: var(--ink);
      background:
        radial-gradient(ellipse at 10% 0%, var(--clr-blue-10) 0%, transparent 45%),
        linear-gradient(180deg, var(--clr-blue-25) 0%, var(--clr-page) 100%);
      min-height: 100dvh;
    }
    .skip-link {
      position: absolute;
      left: 0.75rem;
      top: 0.75rem;
      z-index: 100;
      transform: translateY(-120%);
      background: var(--rwth-blue-deep);
      color: #fff;
      padding: 0.55rem 0.9rem;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      text-decoration: none;
    }
    .skip-link:focus {
      transform: translateY(0);
      outline: 3px solid var(--focus-accent);
      outline-offset: 2px;
    }
    :focus-visible {
      outline: 3px solid var(--focus-ring);
      outline-offset: 2px;
    }
    .bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.85rem 1.25rem;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid #c5d4e4;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .bar a.back {
      color: var(--rwth-blue);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.92rem;
    }
    .bar a.back:hover { text-decoration: underline; }
    .bar .brand {
      font-family: var(--font-rwth);
      color: var(--rwth-blue-deep);
      font-weight: 600;
      font-size: 0.95rem;
    }
    main {
      width: min(680px, 100%);
      margin: 0 auto;
      padding: 2rem 1.35rem 3.5rem;
    }
    .accent-rule {
      height: 3px;
      width: 3.5rem;
      background: var(--accent);
      margin-bottom: 1.1rem;
      border-radius: 2px;
    }
    h1 {
      margin: 0 0 0.85rem;
      font-family: var(--font-rwth);
      font-size: clamp(1.65rem, 3.2vw, 2.15rem);
      color: var(--rwth-blue-deep);
      line-height: 1.2;
      letter-spacing: -0.015em;
    }
    .lead {
      font-size: 1.08rem;
      line-height: 1.6;
      margin: 0 0 1.35rem;
      color: #2c3a4a;
    }
    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-bottom: 1.6rem;
    }
    .badge {
      font-size: 0.75rem;
      font-weight: 500;
      background: #eef3f8;
      border: 1px solid #9bb0c4;
      color: #2a3a4a;
      padding: 0.22rem 0.55rem;
      border-radius: 999px;
    }
    .badge.source-strategy {
      background: #e8f5e0;
      border-color: #7eb35a;
      color: #1f5a0e;
    }
    .badge.source-map {
      background: #e8f1fa;
      border-color: #7aa3c4;
      color: var(--rwth-blue-deep);
    }
    .badge.source-placeholder {
      background: #f7f1e4;
      border-color: #c4a86a;
      color: #5c440f;
    }
    .bullets {
      margin: 0 0 1.75rem;
      padding: 0 0 0 1.15rem;
      border-left: 2px solid var(--line);
      margin-left: 0.15rem;
      padding-left: 1.1rem;
      list-style: disc;
    }
    .bullets li {
      margin-bottom: 0.4rem;
      line-height: 1.5;
      font-size: 0.95rem;
      color: #2c3a4a;
    }
    article.section {
      margin: 0 0 1.75rem;
      padding: 0;
      background: none;
      border: none;
    }
    article.section + article.section {
      padding-top: 1.5rem;
      border-top: 1px solid var(--line);
    }
    article.section h2 {
      margin: 0 0 0.7rem;
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--rwth-blue-deep);
      letter-spacing: -0.01em;
    }
    article.section p {
      margin: 0 0 0.8rem;
      font-size: 0.98rem;
      line-height: 1.6;
      color: #2c3a4a;
    }
    article.section p:last-child { margin-bottom: 0; }
    .missing {
      padding: 1.5rem 0;
    }
    .missing h1 { font-size: 1.5rem; }
    .missing p { color: var(--muted); line-height: 1.5; }
    .missing a {
      color: var(--rwth-blue);
      font-weight: 600;
      text-decoration: none;
    }
    .missing a:hover { text-decoration: underline; }
    footer.page-foot {
      margin-top: 2rem;
      padding-top: 1.15rem;
      border-top: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
      font-size: 0.92rem;
    }
    footer.page-foot a {
      color: var(--rwth-blue);
      font-weight: 600;
      text-decoration: none;
    }
    footer.page-foot a:hover { text-decoration: underline; }
    .official {
      margin: 0 0 1.5rem;
    }
    .official a {
      color: var(--rwth-blue);
      font-weight: 600;
      font-size: 0.98rem;
      text-decoration: none;
    }
    .official a:hover { text-decoration: underline; }
    .learn-more {
      margin: 0 0 1.5rem;
    }
    .learn-more h2 {
      font-family: var(--font-rwth);
      font-size: 1.15rem;
      color: var(--rwth-blue-deep);
      margin: 0 0 0.55rem;
      font-weight: 600;
    }
    .learn-more ul {
      margin: 0;
      padding-left: 1.15rem;
    }
    .learn-more li { margin: 0.3rem 0; }
    .learn-more a {
      color: var(--rwth-blue);
      font-weight: 600;
      font-size: 0.98rem;
      text-decoration: none;
    }
    .learn-more a:hover { text-decoration: underline; }
    .a11y-link {
      display: inline-block;
      margin-top: 0.35rem;
      font-size: 0.85rem;
      color: var(--muted);
      font-weight: 500;
    }
    .lang-switch {
      display: inline-flex;
      align-items: center;
      gap: 0.15rem;
      padding: 0.15rem;
      border: 1px solid #b7c8da;
      border-radius: 8px;
      background: #f7fafc;
    }
    .lang-switch button {
      appearance: none;
      border: none;
      background: transparent;
      color: var(--rwth-blue-deep);
      border-radius: 6px;
      padding: 0.32rem 0.55rem;
      font: inherit;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      min-width: 2.1rem;
    }
    .lang-switch button:hover { background: #eef4fb; }
    .lang-switch button[aria-pressed="true"] {
      background: var(--rwth-blue);
      color: #fff;
    }
    .lang-switch button:focus-visible {
      outline: 3px solid var(--focus-ring);
      outline-offset: 1px;
    }
    .bar-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#content" id="skip-content">Zum Inhalt springen</a>
  <header class="bar">
    <a class="back" id="back-link" href="landkarte.html">← Zurück zur Landkarte</a>
    <div class="bar-actions">
      <div class="lang-switch" id="lang-switch" role="group" aria-label="Sprache">
        <button type="button" id="lang-de" aria-pressed="true" lang="de">DE</button>
        <button type="button" id="lang-en" aria-pressed="false" lang="en">EN</button>
      </div>
      <div class="brand" id="brand-title">RWTH Transfer-Landkarte</div>
    </div>
  </header>

  <main id="content" tabindex="-1">
    <div class="missing">
      <h1 id="loading-title">Laden…</h1>
      <p id="loading-hint">Falls das bestehen bleibt, Seite mit Knoten-ID öffnen, z. B. <code>detail.html?id=rwth-innovation</code>.</p>
    </div>
  </main>

  <script src="assets/i18n.js"></script>
  <script src="assets/nodes.js"></script>
  <script src="assets/details.js"></script>
  <script>
    (function () {
      const I18N = window.TRANSFER_I18N;
      const L = I18N.L;
      const withLangParam = I18N.withLangParam;
      let lang = I18N.detectLang();
      I18N.setLang(lang);

      const params = new URLSearchParams(location.search);
      const id = params.get("id") || (location.hash || "").replace(/^#/, "");
      const nodes = window.TRANSFER_NODES || [];
      const details = window.TRANSFER_DETAILS || {};
      const areaLabels = window.TRANSFER_AREA_LABELS || {};
      const node = nodes.find((n) => n.id === id);
      const detail = details[id];
      const root = document.getElementById("content");
      const langDe = document.getElementById("lang-de");
      const langEn = document.getElementById("lang-en");

      function u() {
        return I18N.ui(lang);
      }

      function escapeHtml(s) {
        return String(s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function syncLangUrl() {
        const url = new URL(location.href);
        url.searchParams.set("lang", lang);
        if (id) url.searchParams.set("id", id);
        history.replaceState(null, "", url);
      }

      function mapHrefFor() {
        const base = id ? "landkarte.html?id=" + encodeURIComponent(id) : "landkarte.html";
        return withLangParam(base, lang);
      }

      function render() {
        const t = u();
        document.documentElement.lang = lang;
        document.getElementById("skip-content").textContent = t.skipContent;
        document.getElementById("back-link").textContent = t.backLandscape;
        document.getElementById("back-link").href = mapHrefFor();
        document.getElementById("brand-title").textContent = t.brandTitle;
        document.getElementById("lang-switch").setAttribute("aria-label", t.langSwitchLabel);
        langDe.setAttribute("aria-pressed", String(lang === "de"));
        langEn.setAttribute("aria-pressed", String(lang === "en"));
        syncLangUrl();

        if (!node) {
          document.title = t.nodeNotFound + t.detailDocTitleSuffix;
          root.innerHTML =
            '<div class="missing"><h1>' +
            escapeHtml(t.nodeNotFound) +
            "</h1><p>" +
            escapeHtml(t.unknownId) +
            " <code>" +
            escapeHtml(id || "(empty)") +
            '</code>.</p><p><a href="' +
            escapeHtml(withLangParam("landkarte.html", lang)) +
            '">' +
            escapeHtml(t.returnLandscape) +
            "</a></p></div>";
          return;
        }

        const title = L(node.title, lang);
        document.title = title + t.detailDocTitleSuffix;

        const sourceBadge =
          '<span class="badge source-' +
          escapeHtml(node.source || "placeholder") +
          '">' +
          escapeHtml((t.sourceLabel && t.sourceLabel[node.source]) || node.source || "—") +
          "</span>";

        const badges =
          sourceBadge +
          (node.areas || [])
            .map(function (a) {
              const full = L(areaLabels[a], lang) || a;
              const short = (t.areaShort && t.areaShort[a]) || full;
              return (
                '<span class="badge" title="' +
                escapeHtml(full) +
                '">' +
                escapeHtml(short) +
                "</span>"
              );
            })
            .join("");

        const bulletsRaw = L(node.bullets, lang);
        const bulletsArr = Array.isArray(bulletsRaw) ? bulletsRaw : [];
        const bullets =
          bulletsArr.length > 0
            ? '<ul class="bullets">' +
              bulletsArr
                .map(function (b) {
                  return "<li>" + escapeHtml(b) + "</li>";
                })
                .join("") +
              "</ul>"
            : "";

        const sections = (detail && detail.sections ? detail.sections : [])
          .map(function (sec) {
            const paras = L(sec.paragraphs, lang);
            const paraArr = Array.isArray(paras) ? paras : [];
            return (
              '<article class="section"><h2>' +
              escapeHtml(L(sec.heading, lang)) +
              "</h2>" +
              paraArr
                .map(function (p) {
                  return "<p>" + escapeHtml(p) + "</p>";
                })
                .join("") +
              "</article>"
            );
          })
          .join("");

        const lead =
          detail && detail.lead ? L(detail.lead, lang) : L(node.summary, lang);

        const detailLinks =
          detail && Array.isArray(detail.links) ? detail.links : [];
        let outbound = "";
        if (detailLinks.length) {
          outbound =
            '<nav class="learn-more" aria-label="' +
            escapeHtml(t.learnMore) +
            '"><h2>' +
            escapeHtml(t.learnMore) +
            "</h2><ul>" +
            detailLinks
              .map(function (link) {
                return (
                  '<li><a href="' +
                  escapeHtml(link.url) +
                  '" target="_blank" rel="noopener noreferrer">' +
                  escapeHtml(L(link.label, lang)) +
                  "</a></li>"
                );
              })
              .join("") +
            "</ul></nav>";
        } else if (node.moreUrl) {
          outbound =
            '<p class="official"><a href="' +
            escapeHtml(node.moreUrl) +
            '" target="_blank" rel="noopener noreferrer">' +
            escapeHtml(t.officialPage) +
            "</a></p>";
        }

        const mapHref = mapHrefFor();
        root.innerHTML =
          '<div class="accent-rule" aria-hidden="true"></div><h1>' +
          escapeHtml(title) +
          '</h1><div class="badges">' +
          badges +
          '</div><p class="lead">' +
          escapeHtml(lead) +
          "</p>" +
          bullets +
          sections +
          outbound +
          '<footer class="page-foot"><a href="' +
          escapeHtml(mapHref) +
          '">' +
          escapeHtml(t.backToNode) +
          '</a><a href="' +
          escapeHtml(withLangParam("landkarte.html", lang)) +
          '">' +
          escapeHtml(t.fullLandscape) +
          '</a></footer>' +
          '<p><a class="a11y-link" href="' +
          escapeHtml(withLangParam("accessibility.html", lang)) +
          '">' +
          escapeHtml(t.a11yLink) +
          "</a></p>";
      }

      langDe.addEventListener("click", function () {
        lang = I18N.setLang("de");
        render();
      });
      langEn.addEventListener("click", function () {
        lang = I18N.setLang("en");
        render();
      });

      render();
    })();
  </script>
</body>
</html>
